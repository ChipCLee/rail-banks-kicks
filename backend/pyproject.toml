[project]
name = "rail-kick-backend"
version = "0.7.0"
description = "FastAPI and YOLOv8s backend for Rail-Kick"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.1.0",
    "opencv-python>=4.10.0,<5.0.0",
    "pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics>=8.3.0,<9.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
]

[tool.uv]
package = false
